name: Monorepo CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run lint
          npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Backend
        working-directory: ./backend
        run: |
          npm ci
          npm run test
          npm run build